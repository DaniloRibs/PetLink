<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta PetLink</title>
    <link rel="icon" type="image/png" href="PetLink_Logo_Marrom.png">
    <style>
        @import url('style.css');
    </style>
</head>
<body>
    <div class="container">
        <img src="PetLink_Logo_Marrom.png" alt="PetLink Logo" width="450">

        <div class="login-box">
            <h2>Cadastrar Conta</h2>
            <form id="cadastro-form">
                <div class="toggle-group" role="radiogroup" aria-label="Tipo de conta">
                    <label class="toggle-option">
                        <input type="radio" name="tipo-conta" value="pessoa" checked>
                        <span>Pessoa</span>
                    </label>
                    <label class="toggle-option">
                        <input type="radio" name="tipo-conta" value="empresa">
                        <span>Empresa</span>
                    </label>
                </div>

                <input type="text" placeholder="Nome Completo / Razão Social" required>
                <input type="email" placeholder="E-mail" required>
                <input type="tel" placeholder="Telefone" required>

                <div class="document-field" data-tipo="pessoa">
                    <input type="text" id="documento-pessoa" placeholder="CPF" required>
                </div>

                <div class="document-field hidden" data-tipo="empresa">
                    <input type="text" id="documento-empresa" placeholder="CNPJ">
                </div>

                <input type="password" placeholder="Senha" required>
                <input type="password" placeholder="Confirmar Senha" required>
                <input type="submit" value="Cadastrar">
            </form>
        </div>
    </div>

    <script>
        const tipoContaInputs = document.querySelectorAll('input[name="tipo-conta"]');
        const documentoPessoa = document.getElementById('documento-pessoa');
        const documentoEmpresa = document.getElementById('documento-empresa');
        const campoPessoa = document.querySelector('.document-field[data-tipo="pessoa"]');
        const campoEmpresa = document.querySelector('.document-field[data-tipo="empresa"]');

        function atualizarDocumento() {
            const tipoSelecionado = document.querySelector('input[name="tipo-conta"]:checked').value;
            const ehPessoa = tipoSelecionado === 'pessoa';

            campoPessoa.classList.toggle('hidden', !ehPessoa);
            campoEmpresa.classList.toggle('hidden', ehPessoa);

            documentoPessoa.required = ehPessoa;
            documentoPessoa.disabled = !ehPessoa;
            documentoEmpresa.required = !ehPessoa;
            documentoEmpresa.disabled = ehPessoa;
        }

        tipoContaInputs.forEach((input) => input.addEventListener('change', atualizarDocumento));
        atualizarDocumento();
    </script>
</body>
</html>
