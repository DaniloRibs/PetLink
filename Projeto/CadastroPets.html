<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Pets PetLink</title>
    <link rel="icon" type="image/png" href="PetLink_Logo_Marrom.png">
    <style>
        @import url('style.css');
    </style>
</head>
<body class="auth-page">
    <div class="auth-shell">
        
        <div class="auth-content">
            <div class="container">
                <div class="login-box">
                    <h2>Cadastrar Pet</h2>
                    <form id="cadastro-pet-form">
                        <input type="text" placeholder="Nome do Pet" required>

                        <div class="field-group">
                            <select id="tipo-animal" name="tipo-animal" required>
                                <option value="" disabled selected hidden>Selecione o tipo</option>
                                <option value="cachorro">Cachorro</option>
                                <option value="gato">Gato</option>
                                <option value="passaro">Pássaro</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>

                        <input type="text" placeholder="Raça" required>
                        <input type="date" placeholder="Data de Nascimento" required>
                        <input type="submit" value="Cadastrar Pet">
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
