<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login PetLink</title>
    <link rel="icon" type="image/png" href="PetLink_Logo_Marrom.png">
    <style>
        @import url('style.css');
    </style>
</head>
<body class="auth-page">
    <div class="auth-shell">
        <header class="auth-header">
            <a class="auth-brand" href="Menu.html" aria-label="Voltar para o menu inicial">
                <img src="PetLink_Logo_Marrom.png" alt="PetLink" class="auth-brand-mark">
            </a>
        </header>

        <div class="auth-content">
            <div class="container">
                <div class="login-box">
                    <h2>Login</h2>
                    <form>
                        <input type="email" placeholder="E-mail" required>
                        <input type="password" placeholder="Senha" required>
                        <input type="submit" value="Entrar">
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
