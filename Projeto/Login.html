<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login PetLink</title>
    <link rel="icon" type="image/png" href="PetLink_Logo_Marrom.png">
    <style>
        @import url('style.css');
    </style>
</head>
<body>
    <div class = "container">   
        <img src="PetLink_Logo_Marrom.png" alt="PetLink Logo" width="450">
    
    <div class="login-box">
        <h2>Login</h2>
        <form>
            <input type="email" placeholder="E-mail" required>
            <input type="password" placeholder="Senha" required>
            <input type="submit" value="Entrar">
        </form>
        <a href="#">Criar Conta</a>
    </div>
    </div>
</body>
</html>
