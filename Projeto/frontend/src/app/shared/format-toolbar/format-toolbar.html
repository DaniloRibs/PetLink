<div class="format-toolbar">
    <button type="button" class="format-btn" [class.active]="boldActive" (click)="toggleInline('bold')" title="Negrito">
        <mat-icon>format_bold</mat-icon>
    </button>
    <button type="button" class="format-btn" [class.active]="italicActive" (click)="toggleInline('italic')"
        title="Itálico">
        <mat-icon>format_italic</mat-icon>
    </button>
    <button type="button" class="format-btn" (click)="toggleHeading()" title="Título">
        <mat-icon>title</mat-icon>
    </button>
    <button type="button" class="format-btn" (click)="applyPlainText()" title="Texto normal">
        <mat-icon>notes</mat-icon>
    </button>
</div>
