<div class="menu-page" [class.theme-farm]="isFarm">

  <header class="menu-header dashboard-header">

    <div class="sidebar-brand">
      <img [src]="isFarm ? 'assets/images/PetLink_Logo_Verde.png' : 'assets/images/PetLink_Logo_Marrom.png'"
        alt="PetLink" class="sidebar-brand-mark">
      <div class="sidebar-brand-text">
        <h1 class="sidebar-brand-title">PetLink</h1>
        <p class="sidebar-brand-subtitle">Imunizar, Cuidar e Conectar</p>
      </div>
    </div>

    <div class="toggle-group mode-toggle" role="radiogroup" aria-label="Tipo de animal">
      <label class="toggle-option">
        <input type="radio" name="animalMode" [checked]="!isFarm" (change)="setMode(AnimalMode.PET)">
        <span><mat-icon>pets</mat-icon> Animais de Estimação</span>
      </label>
      <label class="toggle-option">
        <input type="radio" name="animalMode" [checked]="isFarm" (change)="setMode(AnimalMode.FARM)">
        <span><i class="horseshoe-icon" aria-hidden="true"></i> Animais de Fazenda</span>
      </label>
    </div>

    <div class="menu-actions">
      <app-notification-bell></app-notification-bell>

      <div class="user-menu">
        <button type="button" class="user-menu-trigger" (click)="toggleUserMenu()">
          <span class="user-avatar">{{ userInitial }}</span>
          <span class="user-menu-name">{{ currentUser?.fullname || userEmail || 'Minha conta' }}</span>
          <span class="user-menu-chevron">▾</span>
        </button>

        @if (userMenuOpen) {
        <div class="user-menu-dropdown">
          <a routerLink="/painel/conta/perfil" class="user-menu-item" (click)="closeUserMenu()">
            <mat-icon>settings</mat-icon> Meu perfil
          </a>
          <button type="button" class="user-menu-item user-menu-item-danger" (click)="logout()">
            <mat-icon>logout</mat-icon> Sair
          </button>
        </div>
        }
      </div>
    </div>

  </header>

  <aside class="dashboard-sidebar">

    <div class="sidebar-links">
      <a routerLink="/painel" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
        class="sidebar-item">
        <span class="sidebar-item-icon"><mat-icon>home</mat-icon></span>
        <span class="sidebar-item-label">Painel</span>
      </a>

      <a routerLink="/painel/pets" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
        class="sidebar-item">
        <span class="sidebar-item-icon">
          @if (isFarm) {
          <span class="horseshoe-icon" aria-hidden="true"></span>
          } @else {
          <mat-icon>pets</mat-icon>
          }
        </span>
        <span class="sidebar-item-label">{{ isFarm ? 'Meus Animais' : 'Meus Pets' }}</span>
      </a>

      @if (!isFarm) {
      <a routerLink="/painel/anuncios" routerLinkActive="active-link" class="sidebar-item">
        <span class="sidebar-item-icon"><mat-icon>campaign</mat-icon></span>
        <span class="sidebar-item-label">Anúncios</span>
      </a>

      <a routerLink="/painel/adocoes" routerLinkActive="active-link" class="sidebar-item">
        <span class="sidebar-item-icon"><mat-icon>favorite</mat-icon></span>
        <span class="sidebar-item-label">Adoções</span>
      </a>
      }

      @if (isFarm) {
      <a routerLink="/painel/vendas" routerLinkActive="active-link" class="sidebar-item">
        <span class="sidebar-item-icon"><mat-icon>storefront</mat-icon></span>
        <span class="sidebar-item-label">Vendas</span>
      </a>
      }
    </div>

  </aside>

  <main class="dashboard-content">
    <router-outlet></router-outlet>
  </main>

</div>
